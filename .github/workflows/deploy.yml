# Builds the site in ./site and publishes it to GitHub Pages on every push to main.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build
      # While the room-v2 branch exists, publish it next to the live site at /v2/ so the two can be
      # compared. It's hidden from search engines; re-run this workflow to refresh it.
      - name: Build the room-v2 preview into /v2/
        run: |
          if git ls-remote --exit-code --heads origin room-v2 > /dev/null; then
            git fetch --depth 1 origin room-v2
            git worktree add "$RUNNER_TEMP/v2" FETCH_HEAD
            (cd "$RUNNER_TEMP/v2/site" && npm ci && npm run build)
            mkdir -p dist/v2
            cp -R "$RUNNER_TEMP/v2/site/dist/." dist/v2/
            sed -i 's#<head>#<head><meta name="robots" content="noindex" />#' dist/v2/index.html
            rm -f dist/v2/robots.txt dist/v2/sitemap.xml
          else
            echo "no room-v2 branch; skipping the preview"
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
